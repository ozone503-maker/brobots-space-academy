<script>
'use strict';
/* ============================================================
   BROBOTSvsHUMANSvsALIENS v4, canon integration build.
   Engine evolved from v3.3 (canvas 960x540 SF2-style fighter).
   v4 changes: 19-fighter roster, external lazy-loaded art (NO
   embedded base64), random 11-stage pool with living layers,
   ONE super per match, kudoken pot economy + center drops,
   Dinny the announcer, BRAINS-driven CPU (fair health bars —
   difficulty is brains, never HP/damage scaling).
   Assets live beside this file under fighter-v4-assets/.
   ============================================================ */
const ASSET_BASE = 'fighter-v4-assets/';
const IMG = { hero: {}, cut: {}, atk: {}, stage: {}, logoFinal: null, logoStacked: null };
const _loading = {};
function loadImg(store, key, path){
  const tag = store + ':' + key;
  if (_loading[tag]) return _loading[tag];
  const img = new Image();
  img._ok = false;
  img.onload = function(){ img._ok = true; };
  img.onerror = function(){ img._ok = false; img._err = true; };
  img.src = ASSET_BASE + path;
  if (store === 'logo') IMG[key] = img; else IMG[store][key] = img;
  _loading[tag] = img;
  return img;
}
function ensureHero(id){ return loadImg('hero', id, 'fighters/' + id + '-hero.webp'); }
function ensureCut(id){ return loadImg('cut', id, 'fighters/' + id + '-cut.webp'); }
function ensureAtk(id){ return loadImg('atk', id, 'fighters/' + id + '-atk.webp'); }
function ensureStage(id){ return loadImg('stage', id, 'stages/' + id + '.webp'); }
function ensureLogos(){
  loadImg('logo', 'logoFinal', 'logo/logo-final.png');
  loadImg('logo', 'logoStacked', 'logo/logo-stacked.png');
}
ensureLogos();

/* ---------------- touch controls (deck, from v3.3) ---------------- */
const TCH = { left: false, right: false, down: false, block: false, hit: { jump: false, pl: false, pm: false, ph: false, kl: false, km: false, kh: false, spc: false } };
const _touchMap = {};
function bindBtn(id, on, off){
  const el = document.getElementById(id);
  if (!el) return;
  function start(e){
    e.preventDefault();
    try { initAudio(); } catch (err) {}
    for (let i = 0; i < e.changedTouches.length; i++) _touchMap[e.changedTouches[i].identifier] = el;
    el.classList.add('on'); on();
  }
  function end(e){
    for (let i = 0; i < e.changedTouches.length; i++){
      if (_touchMap[e.changedTouches[i].identifier] === el) delete _touchMap[e.changedTouches[i].identifier];
    }
    let still = false;
    for (const k in _touchMap) if (_touchMap[k] === el) still = true;
    if (!still){ el.classList.remove('on'); off(); }
  }
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', end, { passive: false });
  el.addEventListener('touchcancel', end, { passive: false });
  el.addEventListener('mousedown', function(e){ e.preventDefault(); el.classList.add('on'); on(); });
  el.addEventListener('mouseup', function(){ el.classList.remove('on'); off(); });
  el.addEventListener('mouseleave', function(){ if (el.classList.contains('on')){ el.classList.remove('on'); off(); } });
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}
bindBtn('tb-left',  function(){ TCH.left = true; },  function(){ TCH.left = false; });
bindBtn('tb-right', function(){ TCH.right = true; }, function(){ TCH.right = false; });
bindBtn('tb-down',  function(){ TCH.down = true; },  function(){ TCH.down = false; });
bindBtn('tb-block', function(){ TCH.block = true; }, function(){ TCH.block = false; });
bindBtn('tb-up',    function(){ TCH.hit.jump = true; }, function(){});
bindBtn('tb-pl', function(){ TCH.hit.pl = true; }, function(){});
bindBtn('tb-pm', function(){ TCH.hit.pm = true; }, function(){});
bindBtn('tb-ph', function(){ TCH.hit.ph = true; }, function(){});
bindBtn('tb-kl', function(){ TCH.hit.kl = true; }, function(){});
bindBtn('tb-km', function(){ TCH.hit.km = true; }, function(){});
bindBtn('tb-kh', function(){ TCH.hit.kh = true; }, function(){});
bindBtn('tb-spc',   function(){ TCH.hit.spc = true; }, function(){});
bindBtn('tb-pause', function(){ pressed.KeyP = 1; }, function(){});
bindBtn('tb-mute',  function(){ pressed.KeyM = 1; }, function(){});
(function(){
  const cv = document.getElementById('game');
  if (!cv) return;
  let lastTouchAt = 0;
  function pos(t){
    const r = cv.getBoundingClientRect();
    return { x: (t.clientX - r.left) * (960 / r.width), y: (t.clientY - r.top) * (540 / r.height) };
  }
  cv.addEventListener('touchstart', function(e){
    e.preventDefault(); lastTouchAt = Date.now();
    try { initAudio(); } catch (err) {}
    const p = pos(e.changedTouches[0]);
    mouse.x = p.x; mouse.y = p.y; mouse.clicked = true;
  }, { passive: false });
  cv.addEventListener('touchmove', function(e){
    e.preventDefault();
    const p = pos(e.changedTouches[0]);
    mouse.x = p.x; mouse.y = p.y;
  }, { passive: false });
  cv.addEventListener('mousedown', function(e){
    if (Date.now() - lastTouchAt < 700){ e.stopImmediatePropagation(); e.preventDefault(); }
  }, true);
  cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
(function(){
  const ui = document.getElementById('touchui');
  if (!ui) return;
  const capable = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (capable && window.matchMedia && matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
  setInterval(function(){
    const on = capable && (typeof G !== 'undefined') && G.screen === 'fight';
    ui.style.display = on ? 'flex' : 'none';
  }, 200);
})();
</script>

<script>
'use strict';
const W = 960, H = 540, FLOOR = 468;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');

/* ---------------- utils ---------------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function rnd(a, b){ return a + Math.random() * (b - a); }
function irnd(a, b){ return Math.floor(rnd(a, b + 1)); }
function overlap(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function R(c, x, y, w, h, col){ c.fillStyle = col; c.fillRect(x, y, w, h); }
function CIR(c, x, y, r, col){ c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 6.3); c.fill(); }
function TRI(c, x1, y1, x2, y2, x3, y3, col){ c.fillStyle = col; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x3, y3); c.closePath(); c.fill(); }
function txt(c, str, x, y, size, col, align, bold){
  c.font = (bold === false ? '' : 'bold ') + size + 'px "Courier New",monospace';
  c.textAlign = align || 'center'; c.textBaseline = 'middle';
  c.fillStyle = col; c.fillText(str, x, y);
}
function txtStroke(c, str, x, y, size, col, line){
  c.font = 'bold ' + size + 'px "Courier New",monospace';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = Math.max(3, size / 8); c.strokeStyle = line || '#0b0b10'; c.lineJoin = 'round';
  c.strokeText(str, x, y); c.fillStyle = col; c.fillText(str, x, y);
}

/* ---------------- audio (tiny WebAudio beeps, gesture-safe) ---------------- */
let AC = null, muted = false;
function initAudio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(f, d, type, v, slide){
  if (!AC || muted) return;
  try {
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || 'square'; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), AC.currentTime + d);
    gn.gain.value = v || 0.05;
    gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.connect(gn); gn.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const sfx = {
  hit:   function(){ beep(220, 0.06, 'square', 0.06, -120); },
  heavy: function(){ beep(130, 0.11, 'sawtooth', 0.09, -70); },
  block: function(){ beep(520, 0.04, 'square', 0.03, 0); },
  whiff: function(){ beep(700, 0.03, 'sine', 0.014, -320); },
  jump:  function(){ beep(280, 0.09, 'sine', 0.02, 220); },
  spc:   function(){ beep(170, 0.16, 'square', 0.05, 340); },
  coin:  function(){ beep(1180, 0.07, 'square', 0.04, 220); setTimeout(function(){ beep(1560, 0.09, 'square', 0.04, 0); }, 60); },
  ko:    function(){ beep(320, 0.55, 'sawtooth', 0.09, -280); setTimeout(function(){ beep(90, 0.4, 'sawtooth', 0.08, -40); }, 120); },
  fight: function(){ beep(660, 0.12, 'square', 0.06, 0); setTimeout(function(){ beep(880, 0.14, 'square', 0.06, 0); }, 90); },
  pick:  function(){ beep(440, 0.06, 'square', 0.04, 110); }
};

/* ---------------- input ----------------
   // INPUT SCHEME SWAP POINT — drill verdict lands here.
   ALL player input (keyboard + touch deck) is read through the
   single INPUT module below. To replace the control scheme,
   rewrite INPUT.read() only — nothing else in the engine
   touches keys/TCH directly. */
const keys = {}, pressed = {};
addEventListener('keydown', function(e){
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code) >= 0) e.preventDefault();
  if (!e.repeat) pressed[e.code] = 1;
  keys[e.code] = 1;
  initAudio();
});
addEventListener('keyup', function(e){ keys[e.code] = 0; });
const mouse = { x: 0, y: 0, clicked: false };
cvs.addEventListener('mousemove', function(e){
  const r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
cvs.addEventListener('mousedown', function(e){
  const r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
  mouse.clicked = true;
  initAudio();
});
cvs.addEventListener('touchstart', function(){ initAudio(); try { G.tapGo = true; } catch (e) {} }, { passive: true });
function blankInput(){ return { move: 0, jump: false, crouch: false, block: false, pL: false, pM: false, pH: false, kL: false, kM: false, kH: false, spc: false }; }
const INPUT = {
  read: function(){
    const i = blankInput();
    i.move = (keys.ArrowRight || TCH.right ? 1 : 0) - (keys.ArrowLeft || TCH.left ? 1 : 0);
    i.jump = !!pressed.ArrowUp || TCH.hit.jump;
    i.crouch = !!keys.ArrowDown || TCH.down;
    i.block = !!keys.Space || TCH.block;
    i.pL = !!pressed.KeyA || TCH.hit.pl;
    i.pM = !!pressed.KeyS || TCH.hit.pm;
    i.pH = !!pressed.KeyD || TCH.hit.ph;
    i.kL = !!pressed.KeyZ || TCH.hit.kl;
    i.kM = !!pressed.KeyX || TCH.hit.km;
    i.kH = !!pressed.KeyC || TCH.hit.kh;
    i.spc = !!pressed.KeyW || TCH.hit.spc;
    return i;
  }
};
function playerInput(){ return INPUT.read(); }

/* ============================================================

   shared constants. hDmg/hSu/hRc = HEAVY strike damage / startup /
   recovery (frames @60fps). Light = 0.5x dmg, Medium = 0.75x dmg,
   startup/recovery scale proportionally faster for lighter tiers.
   h = display sprite height in px (Tank=210 is the scale anchor).

  { id:'shockbot', name:'SHOCKBOT',      faction:'ROBOTS', hp:100, spd:3.0, pow:1.00, reach:50, h:164, w:46, jumpV:-12.5, grav:0.78, hDmg:10, hSu:10, hRc:12, spName:'SONIC CHECK',       passive:'MIC CHECK — his blocked strikes still chip 2 and push back extra (sound carries).', q:'Machine-born emcee. Black mustache. Hears empty space differently.' },

function spark(x, y, col, n){
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.28), s = rnd(1, 4.4);
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.6, life: rnd(8, 18), col: col, size: rnd(1.5, 3.2) });

  for (let i = G.parts.length - 1; i >= 0; i--){
    const p = G.parts[i];
    if (p.home){ /* victory-scene kudoken streaming home to the winner */
      const tx = p.home.x, ty = p.home.y - p.home.def.h * 0.55;
      p.vx += clamp(tx - p.x, -9, 9) * 0.014; p.vy += clamp(ty - p.y, -9, 9) * 0.014;
      if (Math.abs(tx - p.x) < 16 && Math.abs(ty - p.y) < 16) p.life = Math.min(p.life, 2);

function startAttack(f, kind){

      const monkeyLow = (foe.def.id === 'monkey' && foe.state === 'crouch' && a.limb === 'punch' && grounded);
      if (!monkeyLow && overlap(atkBox(f), hurtBox(foe))){
        let dmg = a.dmg, stun = a.stun;
        if (a.hot){ dmg *= 1.5; stun += 6; spark(foe.x, foe.y - foe.def.h * 0.5, '#7df9ff', 12); }
        const hit = applyHit(f, foe, dmg, stun, a.kb * (f.pas.flowKb ? 1.5 : 1), a.tier, false);
        f.hasHit = true; f.pas.flowKb = false;
        if (hit){ f.pas.chainHits++; if (f.def.id === 'gabe') f.pas.hitCount = f.pas.hitCount; }
      } else if (monkeyLow && !f.hasHit){ f.hasHit = true; }
    }
    if (f.t === a.su) sfx.whiff();
    if (f.t >= tot){ const whiffed = !f.hasHit; f.atk = null; f.atkPh = ''; if (whiffed) f.pas.chainHits = 0; if (grounded && f.state !== 'hitstun' && f.state !== 'ko') f.state = 'idle'; }
  }
  if (f.state === 'super') updateSuper(f, foe);
  if (freeState(f)){
    const inp = f.input;
    const spdM = (f.superBuff ? 1.25 : 1) * ((f.def.id === 'ozone' && f.pas.rallyT > 0) ? 1.15 : 1);
    if (grounded){
      if (inp.pL) startAttack(f, 'pl');
      else if (inp.pM) startAttack(f, 'pm');
      else if (inp.pH) startAttack(f, 'ph');
      else if (inp.kL) startAttack(f, 'kl');
      else if (inp.kM) startAttack(f, 'km');
      else if (inp.kH) startAttack(f, 'kh');
      else if (inp.spc) startSuper(f);
      else if (inp.jump){ f.vy = f.def.jumpV; f.pas.hops = 1; sfx.jump(); if (f.def.id === 'mantis') f.vx = f.face * 3.2; }
      else if (inp.crouch) f.state = 'crouch';
      else if (inp.block) f.state = 'block';
      else if (inp.move !== 0){
        f.state = 'walk'; f.x += inp.move * f.def.spd * spdM;
        if (f.def.id === 'rich'){ if (inp.move === f.face){ f.pas.fwdT++; if (f.pas.fwdT >= 60) f.pas.flowReady = true; } else f.pas.fwdT = 0; }
      }
      else f.state = 'idle';
    } else {
      if (inp.jump && f.def.id === 'ipo' && f.pas.hops >= 1 && f.vy > -4){ f.vy = -8.5; f.pas.hops = 0; sfx.jump(); } /* SPRING HEELS second hop */
      else if (inp.pL && !f.atk) startAttack(f, 'pl');
      else if (inp.pM && !f.atk) startAttack(f, 'pm');
      else if (inp.pH && !f.atk) startAttack(f, 'ph');
      else if (inp.kL && !f.atk) startAttack(f, 'kl');
      else if (inp.kM && !f.atk) startAttack(f, 'km');
      else if (inp.kH && !f.atk) startAttack(f, 'kh');
      /* IPO air strike dives at a steep downward angle — unique */
      if (f.atk && f.def.id === 'ipo' && f.y < FLOOR - 30){ f.vy = Math.max(f.vy, 3.5); f.vx = f.face * 2.4; }
      f.x += inp.move * f.def.spd * 0.55 * spdM;
    }
  } else if (f.def.id === 'rich') f.pas.fwdT = 0;
  if (f.y < FLOOR || f.vy < 0){
    f.y += f.vy; f.vy += f.def.grav;
    if (f.y >= FLOOR){ f.y = FLOOR; f.vy = 0; if (!f.atk && f.state !== 'super' && f.state !== 'hitstun' && f.state !== 'ko') f.state = 'idle'; }
  }
  f.x += f.vx;
  f.vx *= grounded ? 0.72 : 0.98;
  f.x = clamp(f.x, 44, W - 44);
  if (f.sliding > 0) f.sliding--;
}
function separate(){
  const a = G.p1, b = G.p2;
  if (!a || !b || a.state === 'ko' || b.state === 'ko') return;
  const minD = (a.def.w + b.def.w) * 0.9, d = b.x - a.x;
  if (Math.abs(d) < minD && Math.abs(a.y - b.y) < 60){
    const push = (minD - Math.abs(d)) / 2, s = d >= 0 ? 1 : -1;
    a.x = clamp(a.x - s * push, 44, W - 44);
    b.x = clamp(b.x + s * push, 44, W - 44);
  }
}
function updateFacing(){
  const pair = [[G.p1, G.p2], [G.p2, G.p1]];
  for (let i = 0; i < 2; i++){
    const f = pair[i][0], o = pair[i][1];
    if (f.y >= FLOOR && !f.atk && f.state !== 'hitstun' && f.state !== 'super' && f.state !== 'ko' && f.state !== 'win')
      f.face = o.x >= f.x ? 1 : -1;
  }
}

/* ============================================================
   CPU AI — BRAINS state machines (see BRAINS table header for
   the dial + scaling contract). The AI perceives the player
   through a timestamped snapshot queue delayed by reaction_ms.
   Decision tick ~150ms (9 frames) +/- jitter. NO stat scaling:
   brains only. States: approach, retreat/space, poke, string,
   block, jump_in, punish, contest_drop, taunt (ShockBot), bait
   (Tank boss). Health bars stay fair on every rung.
   ============================================================ */
function aiPerceive(f){
  const ai = f.ai, q = ai.queue;
  const lagFrames = Math.max(1, Math.round(f.brain.reaction / 16.7));
  let snap = q[0];
  for (let i = 0; i < q.length; i++){ if (q[i].frame <= G.frame - lagFrames) snap = q[i]; else break; }
  while (q.length > 2 && q[1] && q[1].frame <= G.frame - lagFrames) q.shift();
  return snap;
}
function aiDecide(f, foe, snap){
  const ai = f.ai, B = f.brain, dist = snap ? snap.dist : Math.abs(foe.x - f.x);
  ai.stateT = 0;
  /* mistake roll — panic whiff / bad jump / dropped block */
  if (Math.random() < B.mistake){
    const m = Math.random();
    if (m < 0.4){ ai.state = 'poke'; ai.pulse = ['pM', 'pH', 'kM'][irnd(0, 2)]; ai.stateDur = 8; }
    else if (m < 0.7){ ai.state = 'jump_in'; ai.badJump = true; ai.stateDur = 20; }
    else { ai.state = 'space'; ai.stateDur = 14; }
    return;
  }
  /* Tank boss bait: player super lit + mid-range -> invite the whiff */
  if (B.boss && snap && snap.foeSuperLit && dist > 130 && dist < 380){ ai.state = 'bait'; ai.stateDur = irnd(26, 44); return; }
  /* contest the center drop (smart greed at r>=3: only when not behind on HP) */
  if (G.drop && Math.random() < B.greed){
    if (!B.smartGreed || f.hp / f.maxhp >= foe.hp / foe.maxhp){ ai.state = 'contest_drop'; ai.stateDur = 50; return; }
  }
  /* punish a perceived recovery */
  if (snap && snap.foeRecovering && dist < f.def.reach + 120){ ai.state = 'punish'; ai.stateDur = 26; return; }
  /* block a perceived incoming strike */
  if (snap && snap.foeAttacking && dist < 300 && Math.random() < B.block){ ai.state = 'block'; ai.stateDur = irnd(12, 26); return; }
  /* super discipline: kill-confirm / whiff-punish fire at any disc;
     otherwise fire-wildly probability scales with (1 - disc) */
  if (!f.superUsed && G.phase === 'fight'){
    const estKill = 13 * f.def.pow;
    const killConfirm = foe.hp <= estKill && dist < 320;
    const whiffPunish = snap && snap.foeRecovering && dist < 300;
    if (killConfirm || whiffPunish || (dist < 300 && Math.random() < (1 - B.disc) * 0.30)){ ai.pulse = 'spc'; ai.state = 'space'; ai.stateDur = 6; return; }
  }
  const roll = Math.random();
  const id = f.def.id;
  if (id === 'shockbot' && dist > 420 && Math.random() < 0.14){ ai.state = 'taunt'; ai.stateDur = irnd(24, 40); return; }
  if (id === 'erv' && dist < 190){ ai.state = 'retreat'; ai.stateDur = irnd(14, 24); return; }
  if (id === 'ipo' && dist > 260 && Math.random() < 0.30){ ai.state = 'jump_in'; ai.stateDur = 30; return; }
  if (dist > f.def.reach + 90){
    if (roll < B.aggr) { ai.state = 'approach'; ai.stateDur = irnd(16, 30); }
    else if (roll < B.aggr + 0.25){ ai.state = 'poke'; ai.stateDur = irnd(14, 24); }
    else { ai.state = 'space'; ai.stateDur = irnd(10, 20); }
  } else {
    if (roll < B.aggr * 0.75){ ai.state = 'string'; ai.chainLeft = B.combo; ai.stateDur = 60; }
    else if (roll < B.aggr * 0.75 + 0.22){ ai.state = 'poke'; ai.stateDur = 16; }
    else if (roll < B.aggr * 0.75 + 0.40){ ai.state = 'block'; ai.stateDur = irnd(10, 20); }
    else if (roll < B.aggr * 0.75 + 0.48){ ai.state = 'jump_in'; ai.stateDur = 26; }
    else { ai.state = 'retreat'; ai.stateDur = irnd(8, 16); }
  }
  if (id === 'nonna') { if (ai.state === 'retreat' || ai.state === 'space') ai.state = 'approach'; } /* relentless pressure */
  if (id === 'tank' && ai.state === 'approach' && Math.random() < 0.4) ai.state = 'block'; /* patient counter-puncher */
}
function aiInput(f, foe){
  const inp = blankInput();
  if (G.phase !== 'fight') return inp;
  const ai = f.ai, B = f.brain;
  /* push a perception snapshot every frame */
  ai.queue.push({ frame: G.frame, foeX: foe.x, dist: Math.abs(foe.x - f.x),
    foeAttacking: !!foe.atk && foe.atkPh === 'startup',
    foeRecovering: !!foe.atk && foe.atkPh === 'recovery',
    foeSuperLit: !foe.superUsed });
  if (ai.queue.length > 40) ai.queue.shift();
  const snap = aiPerceive(f);
  ai.tick--;
  if (ai.tick <= 0){ ai.tick = 9 + irnd(-2, 2); aiDecide(f, foe, snap); }
  ai.stateT++;
  const dir = foe.x > f.x ? 1 : -1;
  const dist = Math.abs(foe.x - f.x);
  const st = ai.state;
  if (ai.pulse){ if (ai.pulse === 'spc') inp.spc = true; else inp[ai.pulse] = true; ai.pulse = null; return inp; }
  if (st === 'approach' || st === 'poke'){
    if (dist > f.def.reach + 26) inp.move = dir;
    else if (st === 'poke' && ai.stateT > 4){ inp[['pL', 'pM', 'pH', 'kL', 'kM', 'kH'][irnd(0, 5)]] = true; ai.state = 'space'; ai.stateT = 0; ai.tick = Math.min(ai.tick, 5); }
  }
  else if (st === 'string'){
    if (dist > f.def.reach + 30) inp.move = dir;
    else if (!f.atk && f.state !== 'hitstun'){
      if (ai.chainWait > 0) ai.chainWait--;
      else if (ai.chainLeft > 0){ inp[['pL', 'pM', 'kL', 'kM', 'pH'][irnd(0, 4)]] = true; ai.chainLeft--; ai.chainWait = 16; }
      else { ai.state = 'space'; ai.tick = Math.min(ai.tick, 4); }
    }
  }
  else if (st === 'punish'){ if (dist > f.def.reach + 16) inp.move = dir; else if (!f.atk){ inp.pH = true; ai.state = 'space'; ai.tick = Math.min(ai.tick, 5); } }
  else if (st === 'block' || st === 'bait'){ inp.block = (st === 'block') || (ai.stateT % 24 < 16); if (st === 'bait' && ai.stateT % 24 >= 16) inp.move = -dir; }
  else if (st === 'retreat') inp.move = -dir;
  else if (st === 'space'){ if (dist < 210) inp.move = -dir; }
  else if (st === 'jump_in'){
    if (ai.stateT === 2) inp.jump = true;
    inp.move = ai.badJump ? -dir : dir;
    if (f.y < FLOOR - 34 && dist < f.def.reach + 60){ inp[['pM', 'kL', 'pL'][irnd(0, 2)]] = true; ai.badJump = false; ai.state = 'space'; }
  }
  else if (st === 'contest_drop'){
    if (G.drop){ const dx = G.drop.x - f.x; if (Math.abs(dx) > 22) inp.move = dx > 0 ? 1 : -1; }
    else { ai.state = 'approach'; }
  }
  /* taunt: stand and showboat (ShockBot) — no input */
  if (ai.stateT > (ai.stateDur || 20) && st !== 'string') ai.tick = Math.min(ai.tick, 2);
  return inp;
}

/* ---------------- center drops (Jessie's mechanic) ----------------
   First drop >= 8s into a round, then every 9-16s, one active at
   a time, none in a round's last 5s. Value 5 (20% fat drop 10).
   Claim = stand on the spot 0.4s (Dia 25% faster); a hit cancels.
   Unclaimed despawns after 6s. Claimed value goes to the POT. */
function updateDrops(){
  if (G.phase !== 'fight') return;
  if (!G.drop){
    G.dropNext--;
    if (G.dropNext <= 0 && G.timer > 300){
      const cx = clamp((G.p1.x + G.p2.x) / 2 + rnd(-26, 26), 110, W - 110);
      G.drop = { x: cx, val: Math.random() < 0.2 ? 10 : 5, age: 0, claimF: null, claimT: 0 };
      Dinny.show('card_drop', {});
    }
    return;
  }
  const d = G.drop; d.age++;
  let claimer = null;
  [G.p1, G.p2].forEach(function(f){
    if (f.y >= FLOOR && f.state !== 'ko' && f.state !== 'hitstun' && Math.abs(f.x - d.x) < 34) claimer = f;
  });
  if (claimer){
    if (d.claimF === claimer) d.claimT++; else { d.claimF = claimer; d.claimT = 1; }
    const need = (claimer.def.id === 'dia') ? 18 : 24; /* CHECKED THE EXITS: 25% faster */
    if (d.claimT >= need){
      addPot(d.val);
      Dinny.show('card_claim', { AMT: d.val, SMALL: claimer.def.name });
      Voice.emit('drop_claim', { A: claimer.def.name, POT: G.pot });
      burst(d.x, FLOOR - 14, '#ffd23f', 14);
      G.drop = null; G.dropNext = irnd(540, 960);
      return;
    }
  } else d.claimT = 0;
  if (d.age >= 360){ Dinny.show('card_gone', {}); G.drop = null; G.dropNext = irnd(540, 960); }
}

/* ---------------- living layers: logic hooks ---------------- */
function updateStageLife(){
  const ss = G.stageState; if (!ss) return;
  ss.t++;
  if (G.stageId === 'maunakea'){
    if (!ss.droneActive){ ss.droneTimer--; if (ss.droneTimer <= 0){ ss.droneActive = true; ss.droneX = -70; } }
    else { ss.droneX += 1.7; if (ss.droneX > W + 80){ ss.droneActive = false; ss.droneTimer = irnd(700, 1300); if (Math.random() < 0.35) addPot(3); } } /* TBD-Jessie */
  }
  if (ss.eruptT > 0) ss.eruptT--;
  if (ss.catTimer > 0) ss.catTimer--;
  else { ss.catX += ss.catDir * 1.1; if (ss.catX > W + 50 || ss.catX < -50){ ss.catDir *= -1; ss.catTimer = irnd(500, 1000); } }
}

/* ---------------- fight step ---------------- */
function stepFight(){
  if (pressed.KeyP) G.paused = !G.paused;
  if (pressed.KeyC) Voice.muted = !Voice.muted;
  if (G.paused) return;
  const a = G.p1, b = G.p2;
  Dinny.update(); Voice.update();
  if (G.hitstop > 0){ G.hitstop--; updateParticles(); return; }
  if (G.phase === 'fight'){
    a.input = a.cpu ? aiInput(a, b) : playerInput();
    b.input = b.cpu ? aiInput(b, a) : playerInput();
    G.stats.fightFrames++;
    G.stats.roundMin1 = Math.min(G.stats.roundMin1, a.hp / a.maxhp);
    G.stats.roundMin2 = Math.min(G.stats.roundMin2, b.hp / b.maxhp);
  } else { a.input = blankInput(); b.input = blankInput(); }
  updateFighter(a, b);
  updateFighter(b, a);
  updateProjectiles(); updateFx(); updateDrops(); updateStageLife();
  separate(); updateFacing(); updateParticles(); updateCam();
  G.shake *= 0.82; if (G.shake < 0.4) G.shake = 0;
  [a, b].forEach(function(f){ if (f.dHp > f.hp) f.dHp = Math.max(f.hp, f.dHp - 0.28); });
  G.phaseT++;
  if (G.phase === 'intro'){
    if (G.phaseT === 2){
      /* ANNOUNCE THE MATCH (pacing feature, not decoration): round 1 of
         a match gets Static's introduction (fighters + stakes) and
         Dinny's matchup card already rides from startMatch. Later
         rounds keep the plain ROUND stinger. */
      if (G.round === 1 && G.announceIntro){ G.announceIntro = false; Voice.emit('match_intro', { A: a.def.name, B: b.def.name, STAKES: stakesText() }); }
      else Voice.emit('round_start', {});
    }
    if (G.phaseT === 54) sfx.fight();
    if (G.phaseT >= 82){ G.phase = 'fight'; G.phaseT = 0; Dinny.show('card_fight', {}); Voice.emit('fight_start', {}); }
  } else if (G.phase === 'fight'){
    G.timer--;
    if (G.timer <= 0){
      G.timer = 0;
      const af = a.hp / a.maxhp, bf = b.hp / b.maxhp;
      if (Math.abs(af - bf) < 0.001) endRound(null, 'time');
      else endRound(af > bf ? a : b, 'time');
    }
  } else if (G.phase === 'roundEnd'){
    if (G.phaseT === 42 && G.roundWinner && G.roundWinner.state !== 'ko'){
      G.roundWinner.atk = null; G.roundWinner.spKind = null; G.roundWinner.vx = 0;
      G.roundWinner.state = 'win';
    }
    if (G.phaseT >= 138){
      if (a.wins >= 2 || b.wins >= 2){ G.phase = 'matchEnd'; G.phaseT = 0; }
      else resetRound(G.roundWinner === null);
    }
  } else if (G.phase === 'matchEnd'){
    if (G.phaseT === 60) Voice.emit('match_end', { A: (a.wins >= 2 ? a : b).def.name });
    if (G.phaseT >= 150){ advanceMatch(); enterSettle(); }
  } else if (G.phase === 'settle'){
    /* VICTORY SCENE: the winner collects — kudoken coins stream from
       the arena floor into his hands while the payout tally counts up,
       Dinny's winner + final-pot cards ride (queued by advanceMatch),
       and Static recaps the fight stats mid-scene. */
    if (G.phaseT === 100) Voice.recap();
    if (G.phaseT % 5 === 0 && G.phaseT < 170) spawnCoinHome();
    if (G.phaseT >= 230){ G.phase = 'intermission'; G.phaseT = 0; }
  } else if (G.phase === 'intermission'){
    /* SPONSOR BEAT + NEXT-FIGHT GATE: Static reads ONE sponsor from
       the book; the next bout does NOT autoplay — player tap (ENTER /
       canvas tap) starts it, 25s auto timer is only a backstop. */
    if (G.phaseT === 2 && !G.sponsorDone){ G.sponsorDone = true; Voice.sponsorRead(); }
    if (pressed.Escape) exitIntermission();
    else if (pressed.Enter || pressed.KeyA || mouse.clicked || G.tapGo || G.phaseT >= 1500){ G.tapGo = false; runPending(); }
  }
}
/* ---------------- camera: tight broadcast framing ----------------
   World physics untouched (960x540). The camera targets a view width
   from fighter separation (+ headroom for jump apexes), clamped so
   Tank reads ~55-65% of the play-area height when engaged, and pans
   to keep both fighters framed. Smoothed — no jitter, no cuts. */
function updateCam(){
  const a = G.p1, b = G.p2;
  if (!a || !b) return;
  const dist = Math.abs(a.x - b.x);
  let vw = clamp(dist + 300, 520, 960);
  const topY = Math.min(a.y - a.def.h, b.y - b.def.h);
  vw = clamp(Math.max(vw, ((FLOOR + 66) - topY) * (W / H)), 520, 960);
  const tz = W / vw, vh = H / tz;
  const tcx = clamp((a.x + b.x) / 2, vw / 2, W - vw / 2);
  const tcy = clamp(FLOOR + 14 - vh / 2, vh / 2, H - vh / 2);
  const cam = G.cam, k = 0.07;
  cam.z += (tz - cam.z) * k; cam.cx += (tcx - cam.cx) * k; cam.cy += (tcy - cam.cy) * k;
}

/* ============================================================

   dozens of draw calls max per stage). Paintings are the full
   arena; fighters stand on the painting's floor zone (~bottom

   ============================================================ */
function drawStageBase(c){

}
function drawLiving(c){

    if (ss.droneActive){ c.fillStyle = '#2b2f36'; c.fillRect(ss.droneX - 13, 88, 26, 7); CIR(c, ss.droneX - 15, 91, 3, '#ffd23f'); CIR(c, ss.droneX + 15, 91, 3, '#ffd23f'); CIR(c, ss.droneX, 95, 2.4, '#ff5a4e'); }
  } else if (id === 'kilauea'){

    c.globalAlpha = pulse * 0.5; CIR(c, 480, 505, 190, '#ff6a00'); c.globalAlpha = pulse * 0.3; CIR(c, 200, 520, 90, '#ff3d00'); CIR(c, 760, 520, 90, '#ff3d00'); c.globalAlpha = 1;
    for (let i = 0; i < 8; i++){ const x = 90 + ((i * 131) % 780), y = 520 - ((t * 0.9 + i * 67) % 190); c.globalAlpha = 0.75; CIR(c, x, y, 2.2, i % 2 ? '#ffb347' : '#ff7b2e'); }
    c.globalAlpha = 1;
    if (t % 300 < 26){ c.globalAlpha = 0.35; CIR(c, 480, 512, 16 + (t % 300) * 0.5, '#ff8c42'); c.globalAlpha = 1; }
  } else if (id === 'flashtown'){
    for (let i = 0; i < 3; i++){ c.strokeStyle = 'rgba(190,240,255,0.55)'; c.lineWidth = 2; c.beginPath(); c.ellipse(180 + i * 60, 448, 8 + ((t + i * 30) % 60) * 0.5, 3 + ((t + i * 30) % 60) * 0.16, 0, 0, 6.3); c.stroke(); }
    for (let i = 0; i < 6; i++){ c.globalAlpha = 0.5 + Math.sin(t * 0.2 + i) * 0.3; CIR(c, 620 + (i * 47) % 260, 120 + (i * 53) % 90, 1.8, '#fff6c9'); }

  const s = G.sel, def = selCurDef();

  if (pressed.ArrowRight){ s.col = (s.col + 1) % SEL_ROWS[s.row].ids.length; sfx.pick(); }
  if (pressed.ArrowUp){ s.row = (s.row + SEL_ROWS.length - 1) % SEL_ROWS.length; s.col = Math.min(s.col, SEL_ROWS[s.row].ids.length - 1); sfx.pick(); }

  if (hero._ok){ const sc = Math.min(220 / hero.naturalWidth, 190 / Math.max(1, hero.naturalHeight)); c.drawImage(hero, W / 2 - hero.naturalWidth * sc / 2, 428 - hero.naturalHeight * sc, hero.naturalWidth * sc, hero.naturalHeight * sc); }
  else txt(c, e.def.name, W / 2, 340, 30, '#ffd23f');
  txt(c, 'Cards by DINNY (he says nothing) · Voice: STATIC', W / 2, 452, 11.5, '#7d8791');
  if (Math.sin(G.frame * 0.06) > -0.3) txt(c, 'PRESS ENTER', W / 2, 492, 16, '#4fe3ae');
  drawDinny(c); drawStatic(c); drawCaption(c);
}

/* ---------------- main loop ---------------- */
function step(){
  G.frame++;
  if (pressed.KeyM) muted = !muted;
  if (G.screen === 'title') stepTitle();
  else if (G.screen === 'select') stepSelect();
  else if (G.screen === 'fight') stepFight();
  else if (G.screen === 'end') stepEnd();
  for (const k in pressed) delete pressed[k];
  TCH.hit.jump = TCH.hit.pl = TCH.hit.pm = TCH.hit.ph = TCH.hit.kl = TCH.hit.km = TCH.hit.kh = TCH.hit.spc = false;
  mouse.clicked = false;
}
function render(){
  ctx.clearRect(0, 0, W, H);
  if (G.screen === 'title') drawTitle();
  else if (G.screen === 'select') drawSelect();
  else if (G.screen === 'fight') drawFight();
  else if (G.screen === 'end') drawEnd();
  if (muted) txt(ctx, 'SOUND MUTED', W - 12, 14, 11, '#9aa5b0', 'right');
}
let last = 0, acc = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = ts - last; last = ts;
  if (dt > 250) dt = 250;
  acc += dt;
  while (acc >= 1000 / 60){ step(); acc -= 1000 / 60; }
  render();
}
requestAnimationFrame(frame);
</script>
