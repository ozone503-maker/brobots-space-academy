<!doctype html><meta name=viewport content="width=390"><style>body{margin:0;background:#000}canvas{width:390px;height:844px;display:block}</style>
<canvas id=c width=780 height=1688></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d'),L=s=>new Promise(r=>{const i=new Image;i.onload=()=>r(i);i.src=s});
const OFF={R_foot:0,L_foot:0,R_shin:.3,L_shin:.3,R_thigh:.65,L_thigh:.65,torso:1,R_upperarm:1,L_upperarm:1,R_forearm:1,L_forearm:1,R_fist:1,L_fist:1,head:1};
let LT,FC=[[157,802],[645,793]],RS=[[130,620],[650,620]],FP=[[130,620],[650,620]],TP=[null,null],J,P={},U={},bg,ov,gw,CR;
function pose(t){const K=1.2,w=2*Math.PI*t/4,s=8*K*Math.sin(w),b=9*K*Math.sin(2*w),
 hs=8*K*Math.sin(w-.5),hb=9*K*Math.sin(2*w-.6),f=10*K*Math.sin(2*w+1.2),f2=10*K*Math.sin(2*w+2.4),sh=-3*K*Math.sin(2*w);
 const o={};for(const n in OFF){const k=OFF[n];o[n]=[s*k,b*k,0]}
 o.head=[hs,hb+sh,1.5*Math.sin(w-.5)*Math.PI/180];
 for(const q of ['R_upperarm','L_upperarm','R_forearm','L_forearm','R_fist','L_fist'])o[q][1]+=sh;
 o.R_fist[1]+=f;o.R_forearm[1]+=f*.55;o.L_fist[1]+=f2;o.L_forearm[1]+=f2*.55;o.R_upperarm[1]+=f*.15;o.L_upperarm[1]+=f2*.15;return o}
function draw(t){const sc=window.SC||0.81,ox=390-J._image[0]*sc/2,oy=window.OY||(240+114*sc),KL=1.4,LEG=/thigh|shin/,FT=/foot/,o=pose(t),ns=Object.keys(OFF).sort((a,b)=>J[a].z-J[b].z);
 x.drawImage(bg,0,0);x.save();x.translate(ox,oy);x.scale(sc,sc);
 for(const pass of [U,P])for(const n of ns){const p=J[n],[dx,dy,r]=o[n];x.save();if(LEG.test(n)){x.translate(0,1050);x.scale(1,KL);x.translate(0,-1050)}else if(!FT.test(n))x.translate(0,-350*(KL-1));x.translate(dx,dy);
  if(r){const[nx,ny]=J._joints.neck;x.translate(nx,ny);x.rotate(r);x.translate(-nx,-ny)}
  pass===U?x.drawImage(U[n],p.u[0],p.u[1]):x.drawImage(P[n],p.x,p.y);x.restore()}
 x.restore();const pu=.5+.5*Math.sin(2*Math.PI*t*1.5),fb=6*Math.sin(2*Math.PI*t/2+1),dt=Math.min(.1,Math.max(0,t-(LT??t)));LT=t;const k=1-Math.exp(-dt/.08);
 for(const sd of[0,1]){const g=TP[sd]||RS[sd];FP[sd][0]+=(g[0]-FP[sd][0])*k;FP[sd][1]+=(g[1]-FP[sd][1])*k}
 const FL=im=>{for(const sd of[0,1]){const[px,py]=FP[sd],[cx,cy]=FC[sd];x.drawImage(im,sd*390,0,390,1688,px-(cx-sd*390)*.8,py+fb-cy*.8,312,1350.4)}};
 x.globalAlpha=.6+.4*pu;FL(gw);x.globalAlpha=1;FL(ov);x.globalAlpha=.65+.35*pu;FL(CR[Math.floor(t*12)%3]);x.globalAlpha=1}
const T=e=>{e.preventDefault();TP[0]=TP[1]=null;const r=c.getBoundingClientRect();for(const q of e.touches){const X=(q.clientX-r.left)*780/r.width,Y=(q.clientY-r.top)*1688/r.height;TP[X<390?0:1]=[X,Y]}};
for(const v of['touchstart','touchmove','touchend','touchcancel'])c.addEventListener(v,T,{passive:false});
c.addEventListener('pointermove',e=>{if(e.pointerType=='mouse'&&e.buttons){const r=c.getBoundingClientRect(),X=(e.clientX-r.left)*780/r.width;TP[X<390?0:1]=[X,(e.clientY-r.top)*1688/r.height]}});c.addEventListener('pointerup',e=>{if(e.pointerType=='mouse')TP[0]=TP[1]=null});c.style.touchAction='none';
(async()=>{J=await(await fetch('parts_anim.json')).json();for(const n in OFF){P[n]=await L(n+'.webp');U[n]=await L('u/'+n+'.webp')}
 bg=await L('arena_bg.jpg');ov=await L('fists_kudo.webp');gw=await L('fists_glow.webp');CR=[];for(let k=0;k<3;k++)CR.push(await L('fists_crackle'+k+'.webp'));window.draw=draw;window.ready=1;
 if(!location.hash)(function f(){draw(performance.now()/1000%4);requestAnimationFrame(f)})()})();
</script>
