<script>
'use strict';
const EMB = JSON.parse(document.getElementById('embedded').textContent || '{}');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = cv.width; off.height = cv.height;
const octx = off.getContext('2d');
let SK, ANIMS, SKIN, IMGS = {}, BONES = {}, ORDER = [], cur = 'idle', t0 = performance.now(), slow = false;
const qs = new URLSearchParams(location.search);

async function tryJSON(url, fallback) {
  if (location.protocol.startsWith('http')) { try { const r = await fetch(url, {cache: 'no-store'}); if (r.ok) return await r.json(); } catch (e) {} }
  return fallback;
}
const loadImg = s => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = s; });

// ---------- math (2D affine [a,b,c,d,e,f]) ----------
const mul = (m, n) => [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]];

const ap = (m, x, y) => [m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]];
const D2R = Math.PI / 180;

// ---------- animation sampling ----------
const ease = u => u * u * (3 - 2 * u);
function mirrorAnim(src) {
  const sw = n => n.endsWith('_L') ? n.slice(0, -2) + '_R' : n.endsWith('_R') ? n.slice(0, -2) + '_L' : n;
  const tr = {};
  for (const [b, keys] of Object.entries(src.tracks)) tr[sw(b)] = keys.map(k => ({...k, rot: -(k.rot || 0), x: -(k.x || 0)}));
  return {...src, tracks: tr};

function prepAnims(A) {
  const out = {};
  for (const [n, a] of Object.entries(A)) if (n !== 'about' && !a.mirrorOf) out[n] = a;
  for (const [n, a] of Object.entries(A)) if (a && a.mirrorOf) out[n] = {...mirrorAnim(out[a.mirrorOf]), duration: a.duration, loop: a.loop};
  return out;

const DEF = {rot: 0, x: 0, y: 0, sx: 1, sy: 1, flash: 0, z: 0, follow: 0};
function sample(keys, t) {
  const o = {...DEF};
  if (!keys || !keys.length) return o;
  let i = 0; while (i < keys.length - 1 && keys[i + 1].t <= t) i++;
  const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
  const u = b.t > a.t ? ease(Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t)))) : 0;
  for (const k in DEF) { const va = a[k] ?? DEF[k], vb = b[k] ?? DEF[k]; o[k] = va + (vb - va) * u; }
  return o;
}

// ---------- pose ----------
function pose(animName, t) {
  const A = ANIMS[animName], tt = A.loop ? t % A.duration : Math.min(t, A.duration);

  for (const b of SK.bones) ch[b.name] = sample(A.tracks[b.name], tt);
  for (const b of SK.bones) {
    const p = P[b.name], c = ch[b.name];
    const pp = b.parent ? P[b.parent] : [0, 0];
    const parent = b.parent ? W[b.parent] : [1,0,0,1,0,0];
    W[b.name] = mul(mul(mul(parent, T(p[0] - pp[0] + c.x, p[1] - pp[1] + c.y)), R(c.rot * D2R)), S(c.sx, c.sy));
  }

  const parentOf = n => SK.bones.find(b => b.name === n).parent;

    const [ub, lb] = ik.chain, tgt = SKIN.ikTargets[ik.target];  // tracks named foot_L/foot_R move the target

    const tk = sample(A.tracks[ik.target], tt), tg = [tgt[0] + tk.x, tgt[1] + tk.y];
    let dx = tg[0] - Hw[0], dy = tg[1] - Hw[1], d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(L1 - L2) + 1e-3), L1 + L2 - 1e-3);
    const base = Math.atan2(dy, dx), a = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
    const ka = base + ik._side * a, K = [Hw[0] + L1 * Math.cos(ka), Hw[1] + L1 * Math.sin(ka)];

    W[ub] = mul(mul(T(Hw[0], Hw[1]), R(r1)), S(cu.sx, cu.sy));
    W[lb] = mul(mul(T(K[0], K[1]), R(r2)), S(cl.sx, cl.sy));
    if (ik.end) { const ce = ch[ik.end]; W[ik.end] = mul(mul(T(Fw[0] + ce.x, Fw[1] + ce.y), R(ce.rot * D2R + ce.follow * r2)), S(ce.sx, ce.sy)); }  // follow 0: level boot, 1: turns with the shin
  }
  const Z = {}; for (const b of SK.bones) Z[b.name] = ch[b.name].z;
  return {W, flash: ch.root.flash, Z};
}
function calibrateIK() {
  const P = SKIN.pivots;
  for (const ik of SK.ik) {
    const [ub, lb] = ik.chain, h = P[ub], k = P[lb], f = SKIN.ikTargets[ik.target];
    const L1 = Math.hypot(k[0] - h[0], k[1] - h[1]), L2 = Math.hypot(f[0] - k[0], f[1] - k[1]), d = Math.hypot(f[0] - h[0], f[1] - h[1]);
    const base = Math.atan2(f[1] - h[1], f[0] - h[0]), a = Math.acos(Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
    const err = s => Math.hypot(h[0] + L1 * Math.cos(base + s * a) - k[0], h[1] + L1 * Math.sin(base + s * a) - k[1]);
    ik._side = err(1) < err(-1) ? 1 : -1;
  }
}
// ---------- draw ----------
function drawBG(c) {
  const g = c.createLinearGradient(0, 0, 0, cv.height);
  g.addColorStop(0, '#1b2140'); g.addColorStop(0.55, '#2a1f33'); g.addColorStop(1, '#0d0b10');
  c.fillStyle = g; c.fillRect(0, 0, cv.width, cv.height);
  c.fillStyle = '#3a2a2a'; c.fillRect(0, cv.height * 0.78, cv.width, cv.height * 0.22);
  c.strokeStyle = '#ffffff22'; c.lineWidth = 3;
  for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(0, cv.height * (0.55 + i * 0.06)); c.lineTo(cv.width, cv.height * (0.55 + i * 0.06)); c.stroke(); }
}
function globalM() {
  const sc = (cv.height * 0.86 / SKIN.artSize[1]) * (SKIN.scale || 1);
  const gy = cv.height * 0.93;
  return mul(T(cv.width / 2, gy), mul(S(sc, sc), T(-SKIN.artSize[0] / 2, -SKIN.groundY)));
}
function render(animName, t) {
  const {W, flash, Z} = pose(animName, t), G = globalM();
  const PELV = SK.drawOrder.indexOf('pelvis');  // z > 0: part joins the raised-leg layer just under the pelvis, ordered by z
  const order = SK.drawOrder.map((n, i) => [n, Z[n] > 0.05 ? PELV - 1 + Z[n] / 10 : i]).sort((p, q) => p[1] - q[1]).map(p => p[0]);
  drawBG(ctx);
  // floor shadow
  const sh = ap(G, SKIN.artSize[0] / 2 + (W.root[4] - SKIN.pivots.root[0]) * 0.6, SKIN.groundY);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(sh[0], sh[1] - 4, 170 * G[0], 26 * G[0], 0, 0, 7); ctx.fill();
  octx.setTransform(1,0,0,1,0,0); octx.clearRect(0, 0, off.width, off.height);
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high';
  for (const n of order) {
    const part = SKIN.parts[n]; if (!part || !IMGS[n]) continue;
    const m = mul(G, W[n]); octx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]);
    octx.drawImage(IMGS[n], part.x, part.y);
  }
  if (flash > 0.01) {
    octx.setTransform(1,0,0,1,0,0); octx.globalCompositeOperation = 'source-atop';
    octx.fillStyle = `rgba(255,255,255,${flash})`; octx.fillRect(0, 0, off.width, off.height);
    octx.globalCompositeOperation = 'source-over';
  }
  ctx.drawImage(off, 0, 0);
  if (document.getElementById('bones').checked) {
    ctx.lineWidth = 2;
    for (const b of SK.bones) {
      const p = ap(mul(G, W[b.name]), 0, 0);
      if (b.parent) { const q = ap(mul(G, W[b.parent]), 0, 0); ctx.strokeStyle = '#0ff'; ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); }
      ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, 7); ctx.fill();
    }
  }
  ctx.fillStyle = '#fff9'; ctx.font = '600 16px system-ui'; ctx.fillText(animName.toUpperCase().replace('_', ' '), 14, 26);
}

// ---------- ui ----------
const LABELS = {idle: 'Idle', jab_L: 'Jab left', jab_R: 'Jab right', block: 'Block', dodge_L: 'Dodge left', dodge_R: 'Dodge right', hit: 'Hit',
  kick_front_L: 'Front kick left', kick_front_R: 'Front kick right', kick_round_L: 'Roundhouse left', kick_round_R: 'Roundhouse right'};
function buildUI() {
  const bar = document.getElementById('bar'); bar.innerHTML = '';
  const names = [...Object.keys(LABELS).filter(n => ANIMS[n]), ...Object.keys(ANIMS).filter(n => !LABELS[n])];
  for (const n of names) {
    const b = document.createElement('button'); b.textContent = LABELS[n] || n; b.dataset.a = n;
    b.onclick = () => setAnim(n); bar.appendChild(b);
  }
  setAnim(cur);
  document.getElementById('slow').onchange = e => { slow = e.target.checked; t0 = performance.now(); };
}
function setAnim(n) { cur = n; t0 = performance.now(); for (const b of document.querySelectorAll('#bar button')) b.classList.toggle('on', b.dataset.a === n); }
async function loadFighter(name) {
  SKIN = await tryJSON(name + '/skin.json', EMB.skins && EMB.skins[name]);
  IMGS = {};
  await Promise.all(Object.entries(SKIN.parts).map(async ([n, p]) => { IMGS[n] = await loadImg(name + '/' + p.image); }));
  calibrateIK();
}
(async function main() {
  SK = await tryJSON('skeleton.json', EMB.skeleton);
  ANIMS = prepAnims(await tryJSON('animations.json', EMB.animations));
  const sel = document.getElementById('fighter');
  for (const f of Object.keys(EMB.skins || {gavin: 1})) { const o = document.createElement('option'); o.textContent = f; sel.appendChild(o); }
  sel.onchange = async () => { await loadFighter(sel.value); };
  await loadFighter(qs.get('fighter') || 'gavin');
  buildUI();
  // headless hook: window.renderAt('jab_L', 0.18)
  window.renderAt = (a, t) => { render(a, t); return true; };
  window.rigReady = true;
  if (qs.has('still')) return;
  (function loop() { const t = (performance.now() - t0) / 1000 * (slow ? 0.25 : 1); render(cur, t); requestAnimationFrame(loop); })();
})();
</script>
