<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BROBOTS FIGHTER — Space Factory Showdown</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b10;color:#d3dae0;font-family:"Courier New",monospace;}
  #wrap{max-width:960px;margin:0 auto;padding:10px;}
  canvas{width:100%;height:auto;display:block;background:#14140f;border:2px solid #8e99a4;image-rendering:pixelated;}
  #note{text-align:center;font-size:13px;color:#9aa5b0;padding:8px 4px;line-height:1.6;}
  #note b{color:#4fe3ae;}
  @media (max-width:640px){ #kbdonly{color:#ff9d94;font-weight:bold;} }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="960" height="540"></canvas>
<div id="note">
  <b>CONTROLS</b> — Move: &#8592; &#8594; &nbsp; Jump: &#8593; &nbsp; Crouch / Low Block: &#8595; &nbsp; <b>A</b> Light &nbsp; <b>D</b> Heavy &nbsp; <b>W</b> Special &nbsp; <b>S</b> Block &nbsp; <b>P</b> Pause &nbsp; <b>M</b> Mute<br>
  <span id="kbdonly">Best played with a keyboard.</span> Pick a fighter. Beat the ladder. Tank is waiting.
</div>
</div>
<script>
'use strict';
/* ============================================================
   BROBOTS FIGHTER v1 — a Street Fighter 2-style canvas fighter.
   Pure HTML/CSS/JS. No assets, no frameworks.
   ============================================================ */
const W = 960, H = 540, FLOOR = 468;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');

/* ---------------- utils ---------------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function rnd(a, b){ return a + Math.random() * (b - a); }
function irnd(a, b){ return Math.floor(rnd(a, b + 1)); }
function prand(seed){ const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function overlap(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function R(c, x, y, w, h, col){ c.fillStyle = col; c.fillRect(x, y, w, h); }
function CIR(c, x, y, r, col){ c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 6.3); c.fill(); }
function TRI(c, x1, y1, x2, y2, x3, y3, col){ c.fillStyle = col; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x3, y3); c.closePath(); c.fill(); }
function vgrad(c, x, y, w, h, stops){ const gr = c.createLinearGradient(0, y, 0, y + h); for (let i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]); c.fillStyle = gr; c.fillRect(x, y, w, h); return gr; }
function hgrad(c, x, y, w, h, stops){ const gr = c.createLinearGradient(x, 0, x + w, 0); for (let i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]); c.fillStyle = gr; c.fillRect(x, y, w, h); return gr; }
function txt(c, str, x, y, size, col, align, bold){
  c.font = (bold === false ? '' : 'bold ') + size + 'px "Courier New",monospace';
  c.textAlign = align || 'center'; c.textBaseline = 'middle';
  c.fillStyle = col; c.fillText(str, x, y);
}
function txtStroke(c, str, x, y, size, col, line){
  c.font = 'bold ' + size + 'px "Courier New",monospace';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineWidth = Math.max(3, size / 8); c.strokeStyle = line || '#0b0b10'; c.lineJoin = 'round';
  c.strokeText(str, x, y); c.fillStyle = col; c.fillText(str, x, y);
}

/* ---------------- audio (tiny WebAudio beeps, gesture-safe) ---------------- */
let AC = null, muted = false;
function initAudio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(f, d, type, v, slide){
  if (!AC || muted) return;
  try {
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || 'square'; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), AC.currentTime + d);
    gn.gain.value = v || 0.05;
    gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.connect(gn); gn.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const sfx = {
  hit:   function(){ beep(220, 0.06, 'square', 0.06, -120); },
  heavy: function(){ beep(130, 0.11, 'sawtooth', 0.09, -70); },
  block: function(){ beep(520, 0.04, 'square', 0.03, 0); },
  whiff: function(){ beep(700, 0.03, 'sine', 0.014, -320); },
  jump:  function(){ beep(280, 0.09, 'sine', 0.02, 220); },
  spc:   function(){ beep(170, 0.16, 'square', 0.05, 340); },
  ko:    function(){ beep(320, 0.55, 'sawtooth', 0.09, -280); setTimeout(function(){ beep(90, 0.4, 'sawtooth', 0.08, -40); }, 120); },
  fight: function(){ beep(660, 0.12, 'square', 0.06, 0); setTimeout(function(){ beep(880, 0.14, 'square', 0.06, 0); }, 90); },
  pick:  function(){ beep(440, 0.06, 'square', 0.04, 110); }
};

/* ---------------- input ---------------- */
const keys = {}, pressed = {};
addEventListener('keydown', function(e){
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code) >= 0) e.preventDefault();
  if (!e.repeat) pressed[e.code] = 1;
  keys[e.code] = 1;
  initAudio();
});
addEventListener('keyup', function(e){ keys[e.code] = 0; });
const mouse = { x: 0, y: 0, clicked: false };
cvs.addEventListener('mousemove', function(e){
  const r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
cvs.addEventListener('mousedown', function(e){
  const r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
  mouse.clicked = true;
  initAudio();
});
function blankInput(){ return { move: 0, jump: false, crouch: false, block: false, atkL: false, atkH: false, spc: false }; }
function playerInput(){
  const i = blankInput();
  i.move = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  i.jump = !!pressed.ArrowUp;
  i.crouch = !!keys.ArrowDown;
  i.block = !!keys.KeyS;
  i.atkL = !!pressed.KeyA;
  i.atkH = !!pressed.KeyD;
  i.spc = !!pressed.KeyW;
  return i;
}


/* ---------------- roster ----------------
   spd = walk speed, pow = damage multiplier, reach = punch range (px),
   h/w = body size, special: proj | spray | wave | dash | charge | grab */
const SPC_COST = 30;
const FIGHTERS = [
  { id:'ipo',      name:'IPO',           stage:'FLASHTOWN FARM',    hp:105, spd:3.5, pow:0.95, reach:54, h:132, w:30, special:'dash',   spName:'PUPPY POUNCE',   q:'The Fruity Puppy herself. Tall, pink, and faster than she looks.' },
  { id:'erv',      name:'ERV',           stage:'THE SWAMP LAB',     hp:115, spd:2.2, pow:1.10, reach:46, h:86,  w:52, special:'spray',  spName:'TOAD SPRAY',     q:'Cane toad scientist. Does not moisturize. He sprays.' },
  { id:'monkey',   name:'MONKEY JOCKEY', stage:'PUNAHELE SPEEDWAY', hp:88,  spd:4.4, pow:0.80, reach:44, h:82,  w:28, special:'dash',   spName:'PHOTO FINISH',   q:'Fastest thing on the track. Blink and the race is over.' },
  { id:'shockbot', name:'SHOCKBOT',      stage:'ROBOT LOUNGE',      hp:100, spd:3.0, pow:1.00, reach:50, h:124, w:34, special:'proj',   spName:'SONIC MIC BLAST',q:'Machine-born emcee. Hears empty space differently from humans.' },
  { id:'nonna',    name:'NONNA',         stage:"NONNA'S KITCHEN",   hp:100, spd:2.6, pow:1.05, reach:48, h:110, w:38, special:'proj',   spName:'MEATBALL TOSS',  q:'Sabotaged by her spaghetti addiction. Still undefeated at dinner.' },
  { id:'buff',     name:'BUFF BRO BOT',  stage:'ROBOT GYM',         hp:120, spd:2.4, pow:1.20, reach:54, h:130, w:50, special:'grab',   spName:'BRO SLAM',       q:'All mirror, all menace. Never skips arm day. There is only arm day.' },
  { id:'bull',     name:'BULL BOT',      stage:'DUSTBOWL ARENA',    hp:112, spd:2.9, pow:1.10, reach:50, h:120, w:44, special:'charge', spName:'BULL RUSH',      q:'Red cape sold separately. He charges first and files the paperwork never.' },
  { id:'tank',     name:'TANK',          stage:'BROBOTS SPACE FACTORY', hp:140, spd:1.9, pow:1.30, reach:58, h:150, w:54, special:'wave', spName:'FACTORY SLAM', q:'The huge tank-like guy. Final boss of the Space Factory.' }
];
function defById(id){ for (let i = 0; i < FIGHTERS.length; i++) if (FIGHTERS[i].id === id) return FIGHTERS[i]; return FIGHTERS[0]; }

/* ---------------- stages (one home arena per fighter) ---------------- */
function stageFloor(c, base, line, plate){
  R(c, 0, FLOOR, W, H - FLOOR, base);
  R(c, 0, FLOOR, W, 3, line);
  if (plate){ c.fillStyle = plate; for (let x = 40; x < W; x += 120) c.fillRect(x, FLOOR + 34, 70, 3); }
}
const STAGES = {
  /* TANK — the Space Factory floor (the house arena) */
  tank: function(c, t){
    vgrad(c, 0, 0, W, H, [[0, '#101008'], [0.7, '#181810'], [1, '#14140f']]);
    c.fillStyle = '#1e2019'; for (let x = 30; x < W; x += 150) c.fillRect(x, 0, 16, FLOOR);
    c.fillStyle = '#26281f'; for (let x = 105; x < W; x += 150) c.fillRect(x, 0, 4, FLOOR);
    /* hanging chains */
    c.fillStyle = '#3a3d33';
    const chx = [90, 470, 860];
    for (let i = 0; i < chx.length; i++){
      const sw = Math.sin(t * 0.02 + i * 2) * 4, len = 66 + i * 14;
      for (let y = 0; y < len; y += 8) c.fillRect(chx[i] + sw * (y / len) - 2, y, 4, 5);
      CIR(c, chx[i] + sw, len + 4, 5, '#45483c');
    }
    /* factory banner */
    R(c, 268, 52, 424, 58, '#20221c'); R(c, 268, 52, 424, 3, '#8e99a4'); R(c, 268, 107, 424, 3, '#8e99a4');
    txt(c, 'BROBOTS SPACE FACTORY', 480, 76, 21, '#d3dae0');
    const gr = c.createLinearGradient(268, 0, 692, 0); gr.addColorStop(0, '#4fe3ae'); gr.addColorStop(0.55, '#22b894'); gr.addColorStop(1, '#3ca9e5');
    c.fillStyle = gr; c.fillRect(288, 96, 384, 4);
    /* crates + robot arm silhouette */
    R(c, 36, FLOOR - 54, 62, 54, '#22241d'); R(c, 48, FLOOR - 92, 44, 38, '#26281f');
    R(c, 872, FLOOR - 120, 14, 120, '#22241d'); R(c, 800, FLOOR - 120, 86, 12, '#22241d'); R(c, 800, FLOOR - 108, 10, 34, '#22241d');
    stageFloor(c, '#23231c', '#4fe3ae', '#2e2e26');
    c.fillStyle = '#c9a227'; for (let x = 0; x < 130; x += 16){ c.save(); c.translate(x, FLOOR + 52); c.rotate(0.6); c.fillRect(0, 0, 10, 4); c.restore(); }
  },
  /* IPO — Fruity Puppy farm at FlashTown */
  ipo: function(c, t){
    vgrad(c, 0, 0, W, FLOOR, [[0, '#8ed0ff'], [0.55, '#ffe3ae'], [0.85, '#ffb37a'], [1, '#ff9e6a']]);
    CIR(c, 830, 92, 34, '#fff3b0'); CIR(c, 830, 92, 44, 'rgba(255,240,170,0.25)');
    /* volcano silhouette */
    TRI(c, 40, FLOOR, 330, 168, 620, FLOOR, '#6b4a71');
    TRI(c, 268, 218, 330, 168, 392, 218, '#7d5a84');
    const sm = (t * 0.3) % 120;
    CIR(c, 330 + sm * 0.4, 150 - sm * 0.5, 8 + sm * 0.22, 'rgba(240,240,240,0.35)');
    CIR(c, 322 + sm * 0.25, 158 - sm * 0.35, 6 + sm * 0.16, 'rgba(240,240,240,0.28)');
    /* jungle canopy */
    c.fillStyle = '#2e6b34';
    const blobs = [[30, 420, 60], [110, 438, 46], [700, 430, 56], [790, 416, 64], [880, 440, 48], [610, 444, 40]];
    for (let i = 0; i < blobs.length; i++) CIR(c, blobs[i][0], blobs[i][1], blobs[i][2], i % 2 ? '#35793c' : '#2e6b34');
    /* lilikoi vine on a post, right side */
    R(c, 902, 250, 8, FLOOR - 250, '#5a4632');
    c.strokeStyle = '#3c8a44'; c.lineWidth = 4; c.beginPath(); c.moveTo(906, 250);
    c.bezierCurveTo(860, 300, 940, 340, 900, 400); c.stroke();
    const fl = [[884, 300], [922, 336], [892, 386], [918, 268]];
    for (let i = 0; i < fl.length; i++){ CIR(c, fl[i][0], fl[i][1], 6, '#b388ff'); CIR(c, fl[i][0] + 14, fl[i][1] + 16, 5, '#ffd94d'); }
    /* farm rows */
    stageFloor(c, '#4a7c3a', '#8fce62');
    R(c, 0, FLOOR + 26, W, 20, '#8a6a44');
    c.fillStyle = '#3c6a30'; for (let x = 8; x < W; x += 26) c.fillRect(x, FLOOR + 8, 3, 8);
  },
  /* ERV — swamp lab bench */
  erv: function(c, t){
    vgrad(c, 0, 0, W, H, [[0, '#16241a'], [0.7, '#1c2f1e'], [1, '#101a12']]);
    /* shelves with jars */
    const shelfY = [120, 210];
    for (let s = 0; s < shelfY.length; s++){
      R(c, 60, shelfY[s] + 44, 840, 8, '#3a2e20');
      for (let i = 0; i < 9; i++){
        const jx = 84 + i * 92 + (s ? 30 : 0), jw = 26 + prand(i * 3 + s) * 18, jh = 30 + prand(i * 7 + s) * 14;
        const liq = ['#7fd069', '#e0c341', '#5ac8fa', '#c586ff', '#ff8a5c'][irnd(0, 4) % 5 + ((i + s) % 2 ? 0 : 0)];
        R(c, jx, shelfY[s] + 44 - jh, jw, jh, 'rgba(200,230,210,0.30)');
        R(c, jx + 3, shelfY[s] + 44 - jh * 0.62, jw - 6, jh * 0.58, ['#7fd069', '#e0c341', '#5ac8fa', '#c586ff', '#ff8a5c'][(i + s * 2) % 5]);
        R(c, jx + jw / 2 - 5, shelfY[s] + 40 - jh, 10, 5, '#222');
      }
    }
    /* hanging lamp */
    R(c, 476, 0, 3, 52, '#0c0f0c');
    TRI(c, 444, 82, 512, 82, 492, 50, '#2c2c28'); TRI(c, 444, 82, 512, 82, 492, 50, '#3a3a34');
    CIR(c, 478, 84, 7, '#ffe9a3');
    TRI(c, 420, FLOOR, 540, FLOOR, 480, 86, 'rgba(255,233,163,0.07)');
    /* big specimen jar, right */
    R(c, 806, 300, 84, 168, 'rgba(180,220,190,0.20)'); R(c, 800, 292, 96, 10, '#2c2c28');
    for (let i = 0; i < 4; i++){ const by = 440 - ((t * 0.7 + i * 34) % 130); CIR(c, 830 + (i % 3) * 18, by, 3.5, 'rgba(220,255,225,0.6)'); }
    CIR(c, 848, 420, 20, '#5d7a35'); CIR(c, 838, 414, 4, '#d8ffd0'); CIR(c, 858, 414, 4, '#d8ffd0');
    stageFloor(c, '#26351f', '#7fd069');
    R(c, 0, FLOOR + 30, W, 42, '#1e2b1a');
    c.fillStyle = 'rgba(160,220,170,0.13)'; c.beginPath(); c.ellipse(300, FLOOR + 48, 120, 10, 0, 0, 6.3); c.fill();
  },
  /* MONKEY JOCKEY — the racetrack */
  monkey: function(c, t){
    vgrad(c, 0, 0, W, FLOOR, [[0, '#8ec9ee'], [0.7, '#cfeeff'], [1, '#eaf7ff']]);
    /* grandstand + crowd dots */
    R(c, 60, 96, 840, 118, '#7a4a8c');
    R(c, 48, 84, 864, 14, '#5d3570');
    for (let row = 0; row < 5; row++) for (let i = 0; i < 56; i++){
      const cx = 76 + i * 15 + (row % 2) * 6, cy = 118 + row * 18;
      CIR(c, cx, cy, 4.4, ['#e2483d', '#ffd23f', '#3ca9e5', '#f5efe2', '#22b894', '#ff8ac2'][Math.floor(prand(i * 13 + row * 57) * 6)]);
    }
    R(c, 60, 214, 840, 8, '#5d3570');
    /* finish banner */
    R(c, 648, 236, 8, 150, '#d8d8d8'); R(c, 888, 236, 8, 150, '#d8d8d8');
    R(c, 640, 228, 264, 34, '#f5f5f5');
    for (let i = 0; i < 8; i++) for (let j = 0; j < 2; j++) if ((i + j) % 2 === 0) R(c, 640 + i * 33, 228 + j * 17, 33, 17, '#191919');
    txt(c, 'FINISH', 772, 246, 17, '#e2483d');
    /* fence */
    R(c, 0, 388, W, 6, '#f0f0f0'); R(c, 0, 424, W, 6, '#f0f0f0');
    c.fillStyle = '#e8e8e8'; for (let x = 16; x < W; x += 64) c.fillRect(x, 380, 6, 62);
    /* dirt track */
    stageFloor(c, '#b08954', '#e8dcc0');
    c.fillStyle = '#9a7443'; for (let i = 0; i < 40; i++) c.fillRect(prand(i * 31) * W, FLOOR + 8 + prand(i * 47) * 56, 10, 3);
    c.fillStyle = 'rgba(255,255,255,0.5)'; for (let x = 30; x < W; x += 150) c.fillRect(x, FLOOR + 60, 70, 4);
  },
  /* SHOCKBOT — robot lounge stage */
  shockbot: function(c, t){
    vgrad(c, 0, 0, W, H, [[0, '#07070f'], [0.7, '#100c1c'], [1, '#0b0b12']]);
    c.fillStyle = '#17102a'; for (let x = 0; x < W; x += 120) c.fillRect(x, 0, 3, FLOOR);
    /* neon sign */
    c.save();
    c.shadowColor = '#ff5da2'; c.shadowBlur = 22;
    R(c, 296, 58, 368, 74, 'rgba(20,8,24,0.9)');
    c.strokeStyle = '#ff5da2'; c.lineWidth = 3; c.strokeRect(296, 58, 368, 74);
    txt(c, 'ROBOT LOUNGE', 480, 88, 30, '#ffb3d1');
    c.restore();
    txt(c, 'LIVE · MIC NIGHTS · NO COVER', 480, 118, 12, '#3ce8e0');
    /* spotlights */
    const sw = Math.sin(t * 0.013) * 60;
    TRI(c, 120, 0, 330, 0, 240 + sw, FLOOR, 'rgba(255,244,190,0.06)');
    TRI(c, 630, 0, 840, 0, 720 - sw, FLOOR, 'rgba(190,230,255,0.06)');
    /* speaker stacks */
    const spk = function(x){ R(c, x, FLOOR - 132, 54, 132, '#14101e'); CIR(c, x + 27, FLOOR - 96, 17, '#241a38'); CIR(c, x + 27, FLOOR - 44, 21, '#241a38'); CIR(c, x + 27, FLOOR - 96, 7, '#3a2a58'); CIR(c, x + 27, FLOOR - 44, 9, '#3a2a58'); };
    spk(28); spk(878);
    /* mic stand silhouette */
    R(c, 474, 330, 4, 108, '#05050a'); TRI(c, 452, FLOOR, 500, FLOOR, 476, 424, '#05050a'); CIR(c, 470, 322, 7, '#05050a');
    stageFloor(c, '#171320', '#ff5da2');
    c.fillStyle = 'rgba(255,93,162,0.10)'; c.fillRect(300, FLOOR + 22, 360, 5);
    c.fillStyle = 'rgba(60,232,224,0.10)'; c.fillRect(360, FLOOR + 44, 240, 4);
  },
  /* NONNA — her kitchen */
  nonna: function(c, t){
    vgrad(c, 0, 0, W, H, [[0, '#f3e9d2'], [1, '#e8d9ba']]);
    /* tile grid */
    c.strokeStyle = 'rgba(160,140,105,0.4)'; c.lineWidth = 1;
    for (let x = 0; x <= W; x += 40){ c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 330); c.stroke(); }
    for (let y = 0; y <= 330; y += 40){ c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    /* window with warm light */
    R(c, 60, 52, 130, 140, '#ffd98f'); R(c, 60, 52, 130, 140, 'rgba(255,255,255,0.15)');
    R(c, 118, 52, 6, 140, '#a9834f'); R(c, 60, 116, 130, 6, '#a9834f'); R(c, 52, 44, 146, 8, '#a9834f'); R(c, 52, 188, 146, 8, '#a9834f');
    /* hanging rail: pots + spaghetti */
    R(c, 330, 42, 380, 6, '#8a8f96');
    const hang = [360, 430, 510, 590, 668];
    for (let i = 0; i < hang.length; i++){
      R(c, hang[i], 48, 3, 22, '#6a6f76');
      if (i % 2 === 0){ CIR(c, hang[i] + 2, 92, 20, '#9aa0a8'); CIR(c, hang[i] + 2, 92, 13, '#c3c9d1'); }
      else { c.fillStyle = '#f2c14e'; for (let s = 0; s < 5; s++) c.fillRect(hang[i] - 6 + s * 3.4, 70, 2, 34 + (s % 2) * 8); }
    }
    /* stove with boiling pots */
    R(c, 730, 330, 180, 138, '#3c4046'); R(c, 730, 330, 180, 12, '#24262a');
    CIR(c, 776, 336, 24, '#14161a'); CIR(c, 864, 336, 24, '#14161a');
    R(c, 748, 292, 56, 40, '#9aa0a8'); R(c, 744, 288, 64, 8, '#6a6f76');
    R(c, 838, 296, 52, 36, '#9aa0a8'); R(c, 834, 292, 60, 8, '#6a6f76');
    for (let i = 0; i < 3; i++){ const sy = 286 - ((t * 0.9 + i * 22) % 54); CIR(c, 766 + i * 16, sy, 5 + i, 'rgba(255,255,255,0.5)'); CIR(c, 852 + i * 14, sy - 8, 4 + i, 'rgba(255,255,255,0.45)'); }
    /* counter left */
    R(c, 40, 356, 220, 14, '#a9834f'); R(c, 52, 370, 12, 98, '#8a6a42'); R(c, 224, 370, 12, 98, '#8a6a42');
    CIR(c, 120, 344, 14, '#e2483d'); CIR(c, 150, 346, 12, '#e2483d'); CIR(c, 180, 344, 13, '#e8a13c');

/* ---------------- particles ---------------- */
function spark(x, y, col, n){
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.28), s = rnd(1, 4.4);
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.6, life: rnd(8, 18), col: col, size: rnd(1.5, 3.2) });

/* ---------------- combat ---------------- */
function hurtBox(f){
  const h = (f.state === 'crouch') ? f.def.h * 0.66 : f.def.h;

}

  const contactY = def.y - def.def.h * 0.55;
  const facingAtt = Math.sign(att.x - def.x) === def.face;
  const blocked = def.blocking && facingAtt && def.y >= FLOOR;

    def.hp = Math.max(1, def.hp - dmg * 0.1);
    def.meter = Math.min(100, def.meter + 3); att.meter = Math.min(100, att.meter + 2);
    def.state = 'blockstun'; def.t = 0; def.stunDur = 6; def.vx = att.face * kb * 0.45;
    spark(contactX, contactY, '#7dd3fc', 6); sfx.block(); G.hitstop = Math.max(G.hitstop, 2);
    return;
  }
  def.hp -= dmg; def.flash = 7;
  def.state = 'hitstun'; def.t = 0; def.stunDur = stun;
  def.vx = att.face * kb;
  if (launch){ def.vy = -8.5; if (def.y >= FLOOR) def.y -= 2; }
  def.atk = null; def.atkPh = ''; def.spKind = null;
  spark(contactX, contactY, kind === 'light' ? '#ffffff' : '#ffd23f', kind === 'light' ? 7 : 13);
  G.hitstop = Math.max(G.hitstop, kind === 'light' ? 3 : 5);
  if (kind === 'light') sfx.hit(); else { sfx.heavy(); G.shake = Math.max(G.shake, kind === 'heavy' ? 4 : 7); }
  att.meter = Math.min(100, att.meter + dmg * 1.1);
  def.meter = Math.min(100, def.meter + dmg * 0.7);
  if (def.hp <= 0){
    def.hp = 0; def.state = 'ko'; def.koT = 0; def.vx = att.face * 6; def.vy = -5.5;
    burst(def.x, def.y - def.def.h * 0.5, '#ffd23f', 22);
    sfx.ko(); G.shake = Math.max(G.shake, 9);
    const other = (def === G.p1) ? G.p2 : G.p1;

}
function startAttack(f, kind){

      else if (inp.block) f.state = 'block';

    if (f.y >= FLOOR && !f.atk && f.state !== 'hitstun' && f.state !== 'special' && f.state !== 'ko' && f.state !== 'win')

/* ---------------- CPU AI ---------------- */
function aiInput(f, foe){

  const ai = f.ai, d = foe.x - f.x, dist = Math.abs(d), dir = d > 0 ? 1 : -1;
  if (ai.blockT > 0){ ai.blockT--; inp.block = true; return inp; }
  if (foe.atk && dist < 200 && Math.random() < ai.blockP * 0.24){ ai.blockT = irnd(12, 26); inp.block = true; return inp; }
  ai.think--;
  if (ai.think <= 0){
    ai.think = Math.max(9, ai.thinkMax + irnd(-5, 5));
    const dp = diffParams(f.diff), kind = f.def.special;
    const ranged = (kind === 'proj' || kind === 'spray' || kind === 'wave');
    const dasher = (kind === 'dash' || kind === 'charge' || kind === 'grab');
    const roll = Math.random();
    ai.pulse = null;
    if (dist > 330){
      if (ranged && f.meter >= SPC_COST && roll < 0.5){ ai.pulse = 'spc'; ai.plan = 'idle'; ai.pt = 6; }
      else if (roll < 0.22){ ai.pulse = 'jump'; ai.plan = 'in'; ai.pt = 24; }
      else { ai.plan = 'in'; ai.pt = irnd(18, 34); }
    } else if (dist > 150){
      if (dasher && f.meter >= SPC_COST && roll < 0.34){ ai.pulse = 'spc'; ai.plan = 'idle'; ai.pt = 6; }
      else if (roll < 0.16){ ai.pulse = 'jump'; ai.plan = 'in'; ai.pt = 20; ai.airAtk = true; }
      else { ai.plan = 'in'; ai.pt = irnd(14, 26); }
    } else {
      const atkP = 0.42 + dp.aggro * 0.4;
      if (f.meter >= SPC_COST && roll < 0.14){ ai.pulse = 'spc'; ai.plan = 'idle'; ai.pt = 6; }
      else if (roll < atkP * 0.55){ ai.pulse = 'atkL'; ai.plan = 'idle'; ai.pt = 4; }
      else if (roll < atkP){ ai.pulse = 'atkH'; ai.plan = 'idle'; ai.pt = 4; }
      else if (roll < atkP + 0.18){ ai.plan = 'block'; ai.pt = irnd(10, 22); }
      else if (roll < atkP + 0.26){ ai.plan = 'out'; ai.pt = irnd(8, 16); }
      else { ai.plan = 'in'; ai.pt = 8; }
    }
  }
  if (ai.pt > 0){
    ai.pt--;
    if (ai.plan === 'in') inp.move = dir;
    else if (ai.plan === 'out') inp.move = -dir;
    else if (ai.plan === 'block') inp.block = true;
  }
  if (ai.pulse){
    if (ai.pulse === 'jump') inp.jump = true;
    else if (ai.pulse === 'atkL') inp.atkL = true;
    else if (ai.pulse === 'atkH') inp.atkH = true;
    else if (ai.pulse === 'spc') inp.spc = true;
    ai.pulse = null;
  }
  if (f.y < FLOOR - 30 && dist < 130 && ai.airAtk){ inp.atkL = true; ai.airAtk = false; }
  return inp;
}
function stepFight(){
  if (pressed.KeyP) G.paused = !G.paused;
  if (G.paused) return;
  const a = G.p1, b = G.p2;
  if (G.hitstop > 0){ G.hitstop--; updateParticles(); return; }
  if (G.phase === 'fight'){
    a.input = a.cpu ? aiInput(a, b) : playerInput();
    b.input = b.cpu ? aiInput(b, a) : playerInput();
  } else { a.input = blankInput(); b.input = blankInput(); }
  updateFighter(a, b);
  updateFighter(b, a);
  updateProjectiles();
  separate(); updateFacing(); updateParticles();
  G.shake *= 0.82; if (G.shake < 0.4) G.shake = 0;
  [a, b].forEach(function(f){ if (f.dHp > f.hp) f.dHp = Math.max(f.hp, f.dHp - 0.28); });
  G.phaseT++;
  if (G.phase === 'intro'){
    if (G.phaseT === 54) sfx.fight();
    if (G.phaseT >= 82){ G.phase = 'fight'; G.phaseT = 0; }
  } else if (G.phase === 'fight'){
    G.timer--;
    if (G.timer <= 0){
      G.timer = 0;
      const af = a.hp / a.maxhp, bf = b.hp / b.maxhp;
      if (Math.abs(af - bf) < 0.001) endRound(null, 'time');
      else endRound(af > bf ? a : b, 'time');
    }
  } else if (G.phase === 'roundEnd'){
    if (G.phaseT === 42 && G.roundWinner && G.roundWinner.state !== 'ko'){
      G.roundWinner.atk = null; G.roundWinner.spKind = null; G.roundWinner.vx = 0;
      G.roundWinner.state = 'win';
    }
    if (G.phaseT >= 138){
      if (a.wins >= 2 || b.wins >= 2){ G.phase = 'matchEnd'; G.phaseT = 0; }
      else resetRound(G.roundWinner === null);
    }
  } else if (G.phase === 'matchEnd'){
    if (G.phaseT >= 150) advanceMatch();
  }
}

/* ---------------- rendering: fighters ---------------- */
function computePose(f){
  const P = { walk: 0, crouch: f.state === 'crouch', block: (f.state === 'block' || f.state === 'blockstun'), hurt: f.state === 'hitstun', win: f.state === 'win', ext: 0, extH: 0, casting: false, dashing: false, t: f.t, animT: f.animT };
  if (f.state === 'walk') P.walk = Math.sin(f.animT * 0.32);
  if (f.atk){
    const v = f.atkPh === 'active' ? 1 : (f.atkPh === 'startup' ? -0.3 : 0.35);
    if (f.atk.kind === 'light') P.ext = v; else P.extH = v;
  }
  if (f.state === 'special'){
    P.casting = true;
    const k = f.spKind;
    if ((k === 'dash' || k === 'charge' || k === 'grab') && f.t >= 3) P.dashing = true;
  }
  return P;
}
function drawSpriteBody(c, f){
  c.save();
  if (f.state === 'ko'){
    c.scale(f.face, 1);
    const p = Math.min(1, f.koT / 16);
    c.rotate(-(Math.PI / 2) * 0.92 * p);
  } else {
    if (f.state === 'idle') c.translate(0, Math.sin(f.animT * 0.09) * 1.6);
    c.scale(f.face, 1);
    if (f.state === 'hitstun') c.rotate(-0.07);
    if (f.state === 'crouch') c.scale(1, 0.84);
  }
  f._K = function(col){ return f.flash > 0 ? ((f.flash % 4 < 2) ? '#ffffff' : '#ff5a4e') : col; };
  SPRITES[f.def.id](c, f, computePose(f));
  c.restore();
}
function drawFighter(c, f){
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.beginPath(); c.ellipse(f.x, FLOOR + 10, f.def.w + 13, 7, 0, 0, 6.3); c.fill();
  c.save();
  c.translate(f.x, f.y);

  c.restore();
}
function drawProjectiles(c){
  for (let i = 0; i < G.proj.length; i++){
    const p = G.proj[i], cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    if (p.kind === 'sonic'){
      c.strokeStyle = '#7df9ff'; c.lineWidth = 3;
      for (let j = 0; j < 3; j++){
        c.beginPath(); c.ellipse(cx - p.face * j * 9, cy, 4 + j * 2, 8 + j * 3.4, 0, 0, 6.3); c.stroke();
      }
      CIR(c, cx, cy, 3.4, '#e8feff');
    } else if (p.kind === 'meatball'){
      CIR(c, cx, cy, 13, '#7a3b22'); CIR(c, cx - 4, cy - 4, 3, '#96603c'); CIR(c, cx + 5, cy + 3, 2.6, '#96603c'); CIR(c, cx - 3, cy - 7, 2.4, '#d8b18a');
    } else if (p.kind === 'spray'){
      for (let j = 0; j < 10; j++){
        const sx = p.x + ((j * 41 + G.frame * 17) % Math.max(10, p.w));
        const sy = p.y + 6 + ((j * 29 + G.frame * 7) % Math.max(8, p.h - 12));
        CIR(c, sx, sy, 4.5 + (j % 3), j % 2 ? 'rgba(127,208,105,0.75)' : 'rgba(90,180,80,0.75)');
      }
      CIR(c, cx, cy, 8, 'rgba(160,230,140,0.5)');
    } else if (p.kind === 'wave'){
      c.fillStyle = '#c9b18a';
      c.beginPath(); c.ellipse(cx, FLOOR - 6, 26, 12, 0, 3.14, 6.3); c.fill();
      c.fillStyle = '#a98f66';
      c.beginPath(); c.ellipse(cx - p.face * 8, FLOOR - 4, 17, 8, 0, 3.14, 6.3); c.fill();
      CIR(c, cx + p.face * 10, FLOOR - 16, 4, '#e8dcc0'); CIR(c, cx - p.face * 4, FLOOR - 22, 3, '#e8dcc0');
    }
  }
}
function drawParticles(c){
  for (let i = 0; i < G.parts.length; i++){

}

/* ---------------- main loop ---------------- */
function step(){
  G.frame++;
  if (pressed.KeyM) muted = !muted;
  if (G.screen === 'title') stepTitle();
  else if (G.screen === 'select') stepSelect();
  else if (G.screen === 'fight') stepFight();
  else if (G.screen === 'end') stepEnd();
  for (const k in pressed) delete pressed[k];
  mouse.clicked = false;
}
function render(){
  ctx.clearRect(0, 0, W, H);
  if (G.screen === 'title') drawTitle();
  else if (G.screen === 'select') drawSelect();
  else if (G.screen === 'fight') drawFight();
  else if (G.screen === 'end') drawEnd();
  if (muted) txt(ctx, 'MUTED', W - 12, 14, 11, '#9aa5b0', 'right');
}
let last = 0, acc = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = ts - last; last = ts;
  if (dt > 250) dt = 250;
  acc += dt;
  while (acc >= 1000 / 60){ step(); acc -= 1000 / 60; }
  render();
}
requestAnimationFrame(frame);
</script>
